name: TrainingPeaks Daily Auto Sync

on:
  schedule:
    # Runs every day at 08:00 UTC (10:00 AM Spain / CEST)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TrainingPeaks Sync
        env:
          TP_AUTH_COOKIE: ${{ secrets.TP_AUTH_COOKIE }}
          TP_ATHLETE_ID: ${{ secrets.TP_ATHLETE_ID }}
        run: |
          python auto_sync_tp.py

      - name: Commit & Push Updated Synced Log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update synced_log.json [skip ci]"
          file_pattern: "synced_log.json"
